<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pomodoro Timer</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f4ef;
        --card: #fffaf3;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #c05b2c;
        --accent-dark: #a64c23;
        --border: #eadfce;
        --shadow: 0 24px 60px rgba(31, 41, 55, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(192, 91, 44, 0.12), transparent 36%),
          linear-gradient(180deg, #fcfaf6, var(--bg));
        color: var(--text);
      }

      main {
        width: min(92vw, 420px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 28px;
        box-shadow: var(--shadow);
      }

      h1 {
        margin: 0 0 6px;
        font-size: 1.8rem;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      .mode {
        display: inline-flex;
        margin-top: 20px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(192, 91, 44, 0.1);
        color: var(--accent-dark);
        font-weight: 600;
        font-size: 0.95rem;
      }

      .timer {
        margin: 20px 0;
        font-size: clamp(3.5rem, 15vw, 5rem);
        font-weight: 800;
        letter-spacing: -0.05em;
        line-height: 1;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      button {
        border: 0;
        border-radius: 14px;
        padding: 14px 12px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .primary {
        background: var(--accent);
        color: white;
      }

      .primary:hover {
        background: var(--accent-dark);
      }

      .secondary {
        background: #efe8de;
        color: var(--text);
      }

      .secondary:hover {
        background: #e6dccd;
      }

      .footer {
        margin-top: 18px;
        font-size: 0.9rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pomodoro Timer</h1>
      <p>Simple focus sessions with a short break built in.</p>

      <div class="mode" id="modeLabel">Focus</div>
      <div class="timer" id="timeDisplay">25:00</div>

      <div class="controls">
        <button class="primary" id="startPauseBtn">Start</button>
        <button class="secondary" id="switchBtn">Switch</button>
        <button class="secondary" id="resetBtn">Reset</button>
      </div>

      <div class="footer">25 min focus, 5 min break.</div>
    </main>

    <script>
      const FOCUS_SECONDS = 25 * 60;
      const BREAK_SECONDS = 5 * 60;

      const timeDisplay = document.getElementById("timeDisplay");
      const modeLabel = document.getElementById("modeLabel");
      const startPauseBtn = document.getElementById("startPauseBtn");
      const switchBtn = document.getElementById("switchBtn");
      const resetBtn = document.getElementById("resetBtn");

      let currentMode = "focus";
      let remainingSeconds = FOCUS_SECONDS;
      let timerId = null;

      function formatTime(seconds) {
        const minutes = String(Math.floor(seconds / 60)).padStart(2, "0");
        const secs = String(seconds % 60).padStart(2, "0");
        return `${minutes}:${secs}`;
      }

      function updateUI() {
        timeDisplay.textContent = formatTime(remainingSeconds);
        modeLabel.textContent = currentMode === "focus" ? "Focus" : "Break";
        startPauseBtn.textContent = timerId ? "Pause" : "Start";
      }

      function setMode(mode) {
        currentMode = mode;
        remainingSeconds = mode === "focus" ? FOCUS_SECONDS : BREAK_SECONDS;
        updateUI();
      }

      function tick() {
        if (remainingSeconds > 0) {
          remainingSeconds -= 1;
          updateUI();
          return;
        }

        setMode(currentMode === "focus" ? "break" : "focus");
      }

      startPauseBtn.addEventListener("click", () => {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        } else {
          timerId = setInterval(tick, 1000);
        }
        updateUI();
      });

      switchBtn.addEventListener("click", () => {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
        setMode(currentMode === "focus" ? "break" : "focus");
      });

      resetBtn.addEventListener("click", () => {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
        setMode(currentMode);
      });

      updateUI();
    </script>
  </body>
</html>
